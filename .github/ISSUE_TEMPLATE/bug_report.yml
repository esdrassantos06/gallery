name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: A link to a minimal repository or sandbox, or the smallest code that shows the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: React version, framework and browser
      placeholder: "React 19, Next.js 16, Safari 19 on iOS"
    validations:
      required: true
  - type: checkboxes
    id: a11y
    attributes:
      label: Accessibility
      options:
        - label: This affects keyboard or screen reader users

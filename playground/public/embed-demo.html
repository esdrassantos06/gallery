<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Embedded page sample</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: #f6f5f2;
        color: #17181a;
        font:
          16px/1.5 ui-sans-serif,
          system-ui,
          sans-serif;
      }
      main {
        max-width: 40ch;
        padding: 24px;
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.5rem;
      }
      p {
        margin: 0;
        color: #55585e;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Embedded page</h1>
      <p>
        A local HTML page shown through a slide with <code>type: "iframe"</code>. Maps, documents or
        players work the same way.
      </p>
    </main>
  </body>
</html>
